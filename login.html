<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مشروع شهادتي</title>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo">شهادتي</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="about.html">عن الموقع</a>
            <a href="contact.html">اتصل بنا</a>
            <a href="login.html" class="active">تسجيل الدخول</a>
        </nav>
    </header>

    <!-- محتوى صفحة تسجيل الدخول -->
    <main class="hero">
        <h1>تسجيل الدخول</h1>
        <p>الرجاء إدخال بيانات حسابك للدخول إلى النظام</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="cta-btn">دخول</button>
        </form>
    </main>

</body>
</html>
